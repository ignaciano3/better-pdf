[package]
name = "better-pdf-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust/WebAssembly core for better-pdf: fill and flatten PDF AcroForms."
repository = "https://github.com/ignaciano3/better-pdf"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.123"
lopdf = { version = "0.41", default-features = false }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# On wasm32, lopdf's (non-optional) getrandom dependency needs its JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.41", default-features = false, features = ["wasm_js"] }
