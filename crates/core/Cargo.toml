[package]
name = "better-pdf-core"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "Rust/WebAssembly core for better-pdf: fill and flatten PDF AcroForms."
repository = "https://github.com/ignaciano3/better-pdf"

[lib]
crate-type = ["cdylib", "rlib"]

# Let wasm-pack run its own bundled wasm-opt (no system Binaryen / PATH needed).
# --enable-bulk-memory is required because the edition-2024 toolchain emits
# memory.copy; -Oz does the real size reduction on the final binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
wasm-bindgen = "0.2.123"
lopdf = { version = "0.41", default-features = false }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
subsetter = "0.2"

# On wasm32, lopdf's (non-optional) getrandom dependency needs its JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.41", default-features = false, features = ["wasm_js"] }
