name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # TypeDoc reads ../../src — install the root deps so its imports resolve.
      - name: Install root deps
        run: bun install --frozen-lockfile

      # TypeDoc resolves src/core/wasm.ts -> ../../pkg-web/*. Build it first.
      - name: Build WASM (browser target)
        run: bun run build:wasm

      - name: Build site
        uses: withastro/action@v6
        with:
          path: ./docs/site
          package-manager: bun
          # The restored node_modules/.astro cache can hold stale Expressive Code
          # CSS hashes after a theme change, shipping <link>s to files that 404.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
